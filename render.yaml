# Render blueprint — deploy this repo as a Docker web service.
#
# Render → New → Blueprint → point at this repo, or create a Web Service manually
# with Runtime = Docker and copy the settings below.
#
# MEMORY: with FACE_ACTIVE_LIVENESS=0 (set below) the app loads ~300 MB and peaks
# ~376 MB under concurrent requests — measured. That fits the 512 MB free tier
# with headroom. (With liveness ON it peaks ~600 MB and needs a >=1 GB paid plan.)
#
# FREE-TIER TRADEOFFS you are accepting:
#   * the service SPINS DOWN after 15 min idle; the next request waits 30-60s
#     while it wakes and reloads models. Fine for a pilot, rough for a live demo
#     (open the link yourself a minute before anyone arrives).
#   * limited CPU — a verification takes several seconds, not one.
#   * 750 compute-hours/month ~ one always-on service; enough for a single box.
#
# Secrets are marked `sync: false` so Render prompts for them instead of storing
# them in git. Values are in .face_db_key_NEWSPACE.json (git-ignored).

services:
  - type: web
    name: contactless-verify
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                  # 512 MB — fits ONLY with FACE_ACTIVE_LIVENESS=0
    region: frankfurt           # closest of Render's regions to Ghana
    healthCheckPath: /healthz   # deliberately exempt from the private-link gate
    autoDeploy: false           # deploy on purpose, not on every push

    envVars:
      # --- access -------------------------------------------------------
      # Whole site answers only to /?k=<FACE_LINK_TOKEN>; anything else 404s.
      - key: FACE_LINK_TOKEN
        sync: false
      - key: FACE_ADMIN_PASSWORD
        sync: false
      - key: FACE_SECRET_KEY
        sync: false

      # --- data at rest -------------------------------------------------
      # BIO_DB_KEY derives the template encryption key. LOSE IT AND EVERY
      # ENROLLED TEMPLATE IS UNREADABLE - keep a copy outside the platform.
      - key: BIO_DB_KEY
        sync: false

      # --- durable state ------------------------------------------------
      # Render's container disk is ephemeral, so state syncs to a private HF
      # Dataset every 60s and restores on boot - same dataset the other
      # deployments use, so enrolments follow the app between hosts.
      - key: FACE_PERSIST_DATASET
        value: kyereboatengcaleb/verification-data
      - key: HF_TOKEN
        sync: false

      # --- pilot behaviour ----------------------------------------------
      - key: FACE_OPEN_ENROLL       # no password to enrol (temporary)
        value: "1"
      - key: FACE_FIELD_DATA        # record every capture + decision
        value: "1"
      - key: FACE_RATE_LIMIT        # testers behind one NAT share an IP
        value: "600"
      - key: FACE_ACTIVE_LIVENESS   # REQUIRED on 512 MB: drops the 3D model too.
        value: "0"                  # face head-turn off; palm liveness unaffected.
      - key: FACE_ANALYTICS_TOKEN   # gates the data-pull endpoints
        sync: false

      # --- palm models (fetched at boot; not committed) -------------------
      - key: PALM_MODEL_HF_REPO
        value: kyereboatengcaleb/palm-ccnet-onnx
      - key: PALM_MODEL_HF_FILE
        value: palm_ccnet_fp16.onnx
      - key: PALM_HAND_MODEL_HF_REPO
        value: kyereboatengcaleb/palm-ccnet-onnx
      - key: PALM_HAND_MODEL_HF_FILE
        value: hand_landmarker.task
