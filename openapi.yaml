openapi: 3.0.3
info:
  title: Face Verification Backbone API
  version: "1.0.0"
  description: >
    Identity verification as a service. Two integration models:
    **managed** (we store encrypted templates per tenant) and **stateless**
    (you keep your own data and pass it in). All endpoints except /v1/health
    require an API key sent as the `X-API-Key` header. Verification/compare
    results are HMAC-signed with your tenant's signing secret so your app can
    trust the allow/deny outcome.


    Keys carry a **role**: `admin` (full control) or `verify` (recognition only —
    cannot enrol, delete, or list). Each tenant is isolated. Calls are metered
    per tenant (see `/v1/usage`) and may be subject to a monthly quota
    (HTTP 429 `quota_exceeded`).
servers:
  - url: https://your-host:5000
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ImageOrEmbedding:
      type: object
      description: Either a base64 image or a precomputed 512-d embedding.
      properties:
        image: { type: string, description: "base64 (or data-URL) JPEG/PNG" }
        embedding: { type: array, items: { type: number } }
    Signature:
      type: object
      properties:
        alg: { type: string, example: HMAC-SHA256 }
        ts: { type: string }
        nonce: { type: string }
        hmac: { type: string }
security:
  - ApiKeyAuth: []
paths:
  /v1/health:
    get:
      summary: Liveness/readiness probe (no auth)
      security: []
      responses: { "200": { description: OK } }
  /v1/challenge:
    get:
      summary: Get an active-liveness head-turn challenge token
      responses:
        "200":
          description: Challenge (or active=false if liveness disabled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  token: { type: string }
                  instruction: { type: string }
  /v1/embed:
    post:
      summary: "Stateless: extract a 512-d face embedding from an image"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties: { image: { type: string } }
      responses:
        "200":
          description: Embedding
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  embedding: { type: array, items: { type: number } }
                  det_score: { type: number }
                  face_px: { type: integer }
                  dims: { type: integer, example: 512 }
  /v1/compare:
    post:
      summary: "Stateless: compare a probe against reference(s), no storage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [probe, references]
              properties:
                probe: { $ref: "#/components/schemas/ImageOrEmbedding" }
                references:
                  type: array
                  items: { $ref: "#/components/schemas/ImageOrEmbedding" }
                threshold: { type: number, description: "default = service match threshold (0.40)" }
      responses:
        "200":
          description: Match result (signed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  match: { type: boolean }
                  best_index: { type: integer }
                  best_score: { type: number }
                  scores: { type: array, items: { type: number } }
                  signature: { $ref: "#/components/schemas/Signature" }
  /v1/enroll:
    post:
      summary: "Managed: enroll a user from one or more images"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
                image: { type: string }
                images: { type: array, items: { type: string } }
                source:
                  type: string
                  enum: [auto, live, id]
                  default: auto
                  description: >
                    Capture routing. 'auto' (default) detects whether an image is an
                    ID document (card/passport) and, if so, extracts the largest face
                    and tags the template provenance as 'id'. 'live' forces the normal
                    live-face path (single-face/pose/liveness gates). 'id' forces the
                    ID-document path. Detection applies to enrollment only; verify and
                    identify always require liveness.
      responses: { "200": { description: "Enrolment summary; per-image results include source ('live'|'id_document'), and for ID-sourced results id_confidence + signals." } }
  /v1/enroll/bulk:
    post:
      summary: "Managed: enrol many users in one call (role: admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                dedupe:
                  type: boolean
                  description: >
                    Reject a person whose biometric already belongs to a different
                    name (per modality; reported under `conflicts`). Default false.
                people:
                  type: array
                  items:
                    type: object
                    required: [user_id]
                    properties:
                      user_id: { type: string }
                      images: { type: array, items: { type: string } }
                      embeddings: { type: array, items: { type: array, items: { type: number } } }
      responses: { "200": { description: Per-user enrolment results } }
  /v1/sync/pull:
    get:
      summary: "Hybrid sync: pull this tenant's templates for offline matching (role: admin, allow_export)"
      description: >
        Streams the tenant's templates (PROTECTED embeddings — see /v1/templates/status —
        never images or raw vectors), incremental by `since` (the previous `next_seq`);
        deletions come back as `deleted: true`. The response's `protection` block
        {scheme, seedref, seed, epoch} carries the domain seed the device uses to
        project live captures before matching; individually reissued users carry their
        own `seedref`/`seed` on their row. A changed `seedref` means the dataset was
        reissued — discard the mirror and re-pull from 0. Requires the tenant's
        `allow_export` entitlement.
      parameters:
        - { name: since, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 500, maximum: 2000 } }
        - { name: modality, in: query, required: false, schema: { type: string, enum: [face, palm], default: face } }
      responses:
        "200": { description: "{ templates[], next_seq, current_seq, done, protection? }" }
        "403": { description: Template export not enabled for this tenant }
  /v1/sync/push:
    post:
      summary: "Hybrid sync: upload on-device templates into this tenant (role: enroll)"
      description: >
        Uploads on-device enrolments (RAW embeddings — the server protects them at
        rest). Cross-identity dedupe: a biometric matching an EXISTING but
        differently-named person is a conflict resolved by `on_conflict` =
        skip (default) | merge | force.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templates]
              properties:
                modality: { type: string, enum: [face, palm], default: face }
                on_conflict: { type: string, enum: [skip, merge, force], default: skip }
                templates:
                  type: array
                  items:
                    type: object
                    required: [user_id, embeddings]
                    properties:
                      user_id: { type: string }
                      embeddings: { type: array, items: { type: array, items: { type: number } } }
      responses:
        "200": { description: "{ pushed, merged, skipped, conflicts[] }" }
  /v1/export/bundle:
    post:
      summary: "Managed: export templates as an encrypted offline provisioning bundle (role: admin, allow_export)"
      description: >
        Export this tenant's templates (PROTECTED embeddings only — never images or
        raw vectors) as a passphrase-encrypted, integrity-protected bundle
        (PBKDF2-HMAC-SHA256 + AES-256-GCM) for provisioning an AIR-GAPPED device
        out-of-band. The payload's `protection` block carries each modality's domain
        seed so the device can project live captures for matching; after a reissue,
        export a fresh bundle. Requires the tenant's `allow_export` entitlement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase:
                  type: string
                  description: "Min 8 chars; the same secret is entered on the device to import."
      responses:
        "200": { description: "{ counts, bundle } — the encrypted bundle object" }
        "403": { description: Template export not enabled for this tenant }
        "503": { description: Encryption library unavailable }
  /v1/verify:
    post:
      summary: "Managed: verify a claimed user (1:1) or identify (1:N)"
      description: >
        Pass `image` for a single-shot check, or `frames` + `token` (from
        /v1/challenge) for an active-liveness head-turn check. Omit `user_id`
        to identify (1:N).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                image: { type: string }
                frames: { type: array, items: { type: string } }
                token: { type: string }
      responses:
        "200":
          description: Verification result (signed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, description: granted }
                  user_id: { type: string }
                  score: { type: number }
                  signature: { $ref: "#/components/schemas/Signature" }
  /v1/identify:
    post:
      summary: "Managed: 1:N identify (image or frames+token)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image: { type: string }
                frames: { type: array, items: { type: string } }
                token: { type: string }
      responses: { "200": { description: Identify result (signed) } }
  /v1/users:
    get:
      summary: "Managed: list enrolled users for this tenant"
      responses: { "200": { description: User list } }
  /v1/users/delete:
    post:
      summary: "Managed: delete one user or many (role: delete)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                user_ids: { type: array, items: { type: string } }
      responses: { "200": { description: Deletion result } }
  /v1/users/export:
    post:
      summary: "Managed: data-subject access — metadata held for a user (role: manage)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties: { user_id: { type: string } }
      responses:
        "200": { description: "What we hold (counts, dim, recent audit) — not the raw template" }
        "404": { description: No record for that user }
  /v1/users/purge:
    post:
      summary: "Managed: erase ALL users in this tenant (role: delete)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties: { confirm: { type: boolean, enum: [true] } }
      responses: { "200": { description: Purge result } }
  /v1/usage:
    get:
      summary: "This tenant's usage this month (counts, quota, remaining)"
      responses: { "200": { description: Usage summary } }
  /v1/tenant/keys:
    get:
      summary: "This tenant's issuer signing keys (role: manage)"
      description: >
        Ed25519 keys the platform uses to sign anything issued on this tenant's
        behalf (credentials, bundles). Active key first; retired keys remain
        listed so previously issued signatures can still be verified.
      responses:
        "200":
          description: >
            Key list. Each item has kid, public_key (base64), created (unix),
            status (active|retired), retired_at (unix, retired only).
  /v1/tenant/keys/rotate:
    post:
      summary: "Rotate the tenant's issuer signing key (role: manage)"
      description: >
        Creates a fresh keypair; the old public key is retained for
        verification only, so previously issued signatures keep verifying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties: { confirm: { type: boolean, enum: [true] } }
      responses:
        "200": { description: "The new active key (kid, public_key, created, status)" }
        "400": { description: Missing confirm flag }
  /v1/templates/status:
    get:
      summary: "Template-protection status (role: manage)"
      description: >
        Stored templates are kept in a scrambled, revocable form (cancelable
        biometrics). Returns per-modality status — enabled, scheme, protection
        epoch, last reissue, user counts — or one user's detail via ?user_id=.
      parameters:
        - { name: user_id, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "Per-modality protection status" }
  /v1/templates/reissue:
    post:
      summary: "Reissue (re-protect) stored templates (role: manage)"
      description: >
        Moves templates to a NEW protection domain — like resetting a password:
        every previously stored or exported protected copy stops matching, while
        enrolled people keep verifying with no recapture. Omit user_id to
        reissue the whole tenant; include it to reissue one person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, enum: [true] }
                user_id: { type: string }
      responses:
        "200": { description: "Reissued row counts per modality" }
        "400": { description: Missing confirm flag }
        "404": { description: user_id not enrolled }
        "409": { description: Protection not enabled on this server }
  /v1/credentials:
    post:
      summary: "Issue a portable offline credential (signed QR) (role: manage)"
      description: >
        Issues a signed, expiring QR credential carrying the user's PROTECTED,
        int8-quantized template in its own matching domain. Any phone that trusts
        the issuer can verify the holder offline — no network, no shared database.
        A stolen/photographed QR is unmatchable against any store, useless without
        the live person, revocable, and expiring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
                modalities: { type: array, items: { type: string, enum: [face, palm] } }
                expiry_days: { type: integer, default: 365, minimum: 1, maximum: 3650 }
                name: { type: string, description: "Display name shown on verify (optional)" }
                attrs: { type: object, description: "Small public attribute map (role, class, ...)" }
      responses:
        "200": { description: "{ credential_id, payload_b45, qr_png_b64, modalities, expires }" }
        "404": { description: User has no enrolment a credential can carry }
        "422": { description: Payload too large for a QR }
    get:
      summary: "List issued credentials (role: manage)"
      parameters:
        - { name: user_id, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "Credential metadata list (never the QR itself)" }
  /v1/credentials/{cid}:
    delete:
      summary: "Revoke an issued credential (role: manage)"
      description: >
        Adds the credential to the tenant's revocation list; offline verifiers
        pick it up with their next trust-store refresh.
      parameters:
        - { name: cid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Revoked }
        "404": { description: No such credential }
  /v1/credentials/verify:
    post:
      summary: "Verify a scanned credential against a live capture (role: verify)"
      description: >
        The hosted version of the offline pipeline: signature -> expiry ->
        revocation -> live capture -> match in the credential's domain. Accepts
        `image` (single shot), `frames` + `token` (active liveness), or a raw
        `embedding` for callers doing their own capture. Failures use typed codes:
        malformed_credential, unsupported_version, bad_signature, unknown_issuer,
        credential_expired, credential_revoked, capture_quality, liveness,
        biometric_mismatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: "The scanned FV1: string" }
                image: { type: string }
                frames: { type: array, items: { type: string } }
                token: { type: string }
                embedding: { type: array, items: { type: number } }
      responses:
        "200": { description: "Verdict with subject {user_id, name, attrs}, issuer, score" }
        "403": { description: bad_signature / unknown_issuer / liveness / biometric modality mismatch }
        "410": { description: credential_expired / credential_revoked }
  /v1/trust-store:
    get:
      summary: "Public signed trust store (no API key)"
      description: >
        Every issuer's public keys (with validity windows) + revocation list
        (exact list or Bloom filter), signed by the server root key. Offline
        verifiers bundle it and refresh opportunistically.
      responses:
        "200": { description: "{ trust_store, kid, sig, root_key }" }
  /v1/trust/{tenant}:
    post:
      summary: "Trust another tenant's credentials (cross-org) (role: manage)"
      description: >
        This tenant's verifiers will accept credentials ISSUED by the named
        tenant. Adopting as a verifier needs no data import — trust the issuer,
        scan their cards.
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Updated trusted_issuers list" }
    delete:
      summary: "Stop trusting another tenant's credentials (role: manage)"
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Updated trusted_issuers list" }
