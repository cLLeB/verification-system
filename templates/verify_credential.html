<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f16">
    <title>Verify a credential</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #0d0f16; color: #f2f4fa; min-height: 100vh;
               display: flex; flex-direction: column; align-items: center; padding: 20px 14px; gap: 14px; }
        h1 { font-size: 1.1rem; font-weight: 700; }
        .step { font-size: .8rem; color: #9aa3b8; }
        video, canvas { width: 100%; max-width: 420px; border-radius: 14px; background: #000; }
        .panel { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
        .btn { border: 0; border-radius: 10px; padding: 13px 16px; font-size: .95rem; font-weight: 600;
               cursor: pointer; background: #4c66f5; color: #fff; width: 100%; }
        .btn.ghost { background: #1b2030; color: #dfe4f2; }
        textarea, input[type=file] { width: 100%; border-radius: 10px; border: 1px solid #2a3145;
               background: #131826; color: #eef1f9; padding: 10px; font-size: .8rem; }
        .verdict { width: 100%; max-width: 420px; border-radius: 16px; padding: 22px 18px;
                   text-align: center; display: none; }
        .verdict.ok  { display: block; background: #103524; border: 1px solid #1f7a4c; }
        .verdict.bad { display: block; background: #3a1520; border: 1px solid #a1334c; }
        .verdict .big { font-size: 1.5rem; font-weight: 800; }
        .verdict .who { margin-top: 8px; font-size: 1.05rem; }
        .verdict .sub { margin-top: 4px; font-size: .8rem; color: #b9c1d4; }
        .hidden { display: none !important; }
        .badge { display: inline-block; margin-top: 10px; font-size: .72rem; padding: 3px 10px;
                 border-radius: 999px; background: rgba(255,255,255,.12); }
    </style>
</head>
<body>
    <h1>Verify a credential</h1>

    <div class="panel" id="step1">
        <p class="step">Step 1 - scan the QR on the person's card or phone.</p>
        <video id="scan-video" autoplay playsinline muted></video>
        <button class="btn ghost" id="scan-toggle">Start camera scan</button>
        <input type="file" id="scan-file" accept="image/*" aria-label="Or upload a photo of the QR">
        <textarea id="scan-paste" rows="2" placeholder="…or paste the FV1: code here"></textarea>
        <button class="btn" id="scan-use">Use this code</button>
    </div>

    <div class="panel hidden" id="step2">
        <p class="step">Step 2 - now a live capture of the person standing in front of you.</p>
        <video id="live-video" autoplay playsinline muted></video>
        <button class="btn" id="live-capture">Capture &amp; verify</button>
    </div>

    <div class="verdict" id="verdict">
        <div class="big" id="v-big"></div>
        <div class="who" id="v-who"></div>
        <div class="sub" id="v-sub"></div>
        <span class="badge" id="v-issuer"></span>
        <button class="btn ghost" id="v-again" style="margin-top:16px">Verify another</button>
    </div>

<script>
const $ = (id) => document.getElementById(id);
let credentialText = "";
let scanStream = null, liveStream = null, scanTimer = null;

// Plain-language copy per typed failure (spec 6.6) - never a raw error.
const FAIL_COPY = {
    malformed_credential: ["Not a valid credential", "This QR isn't one of ours, or it's damaged. Ask for the original card."],
    unsupported_version: ["Newer credential", "This credential needs an updated verifier. Update this app/page."],
    bad_signature: ["TAMPERED / FORGED", "The signature check failed - do not accept this credential."],
    unknown_issuer: ["Issuer not trusted", "This card was issued by an organisation this verifier doesn't trust."],
    credential_expired: ["Expired", "This credential has passed its expiry date. A new one must be issued."],
    credential_revoked: ["REVOKED", "The issuer cancelled this credential. Do not accept it."],
    capture_quality: ["Try the capture again", "The photo wasn't usable - better light, closer, hold steady."],
    liveness: ["Liveness check failed", "Use the real, live person - not a photo or a screen."],
    biometric_mismatch: ["NOT the credential holder", "The live person does not match this credential."],
};

function verdict(ok, big, who, sub, issuer) {
    stopStreams();
    $("step1").classList.add("hidden");
    $("step2").classList.add("hidden");
    const v = $("verdict");
    v.className = "verdict " + (ok ? "ok" : "bad");
    $("v-big").textContent = big;
    $("v-who").textContent = who || "";
    $("v-sub").textContent = sub || "";
    $("v-issuer").textContent = issuer ? `Issuer: ${issuer} · checked ${new Date().toLocaleString()}` : "";
}

function stopStreams() {
    for (const s of [scanStream, liveStream]) if (s) s.getTracks().forEach(t => t.stop());
    scanStream = liveStream = null;
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
}

function gotCredential(text) {
    text = (text || "").trim();
    if (!text.startsWith("FV1:")) {
        verdict(false, ...FAIL_COPY.malformed_credential, null, null);
        return;
    }
    credentialText = text;
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
    $("step1").classList.add("hidden");
    $("step2").classList.remove("hidden");
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(s => {
        liveStream = s; $("live-video").srcObject = s;
    }).catch(() => verdict(false, "Camera unavailable", "", "Allow camera access and reload.", null));
}

// -- step 1: QR in (camera via BarcodeDetector, photo upload, or paste) -------
$("scan-toggle").onclick = async () => {
    if (!("BarcodeDetector" in window)) {
        $("scan-toggle").textContent = "Camera scan unsupported here - upload or paste instead";
        return;
    }
    try {
        scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        $("scan-video").srcObject = scanStream;
        const det = new BarcodeDetector({ formats: ["qr_code"] });
        scanTimer = setInterval(async () => {
            try {
                const codes = await det.detect($("scan-video"));
                if (codes.length) gotCredential(codes[0].rawValue);
            } catch (e) { /* frame not ready */ }
        }, 400);
    } catch (e) {
        $("scan-toggle").textContent = "Camera unavailable - upload or paste instead";
    }
};

$("scan-file").onchange = async () => {
    const f = $("scan-file").files[0];
    if (!f) return;
    if ("BarcodeDetector" in window) {
        try {
            const det = new BarcodeDetector({ formats: ["qr_code"] });
            const bmp = await createImageBitmap(f);
            const codes = await det.detect(bmp);
            if (codes.length) return gotCredential(codes[0].rawValue);
        } catch (e) { /* fall through to server-side decode */ }
    }
    const b64 = await new Promise(res => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.readAsDataURL(f);
    });
    const d = await fetch("/api/credentials/decode-qr", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: b64 }),
    }).then(r => r.json());
    if (d.credential) gotCredential(d.credential);
    else verdict(false, "No QR found", "", "The photo doesn't contain a readable code - try a sharper, closer shot.", null);
};

$("scan-use").onclick = () => gotCredential($("scan-paste").value);

// -- step 2: live capture + hosted verify --------------------------------------
$("live-capture").onclick = async () => {
    const video = $("live-video");
    if (!liveStream || !video.videoWidth) return;
    const c = document.createElement("canvas");
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext("2d").drawImage(video, 0, 0);
    $("live-capture").disabled = true;
    $("live-capture").textContent = "Checking…";
    const d = await fetch("/api/credentials/verify", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: credentialText, image: c.toDataURL("image/jpeg", 0.9) }),
    }).then(r => r.json()).catch(() => ({ code: "capture_quality" }));
    $("live-capture").disabled = false;
    $("live-capture").textContent = "Capture & verify";
    if (d.success) {
        const s = d.subject || {};
        const attrs = s.attrs ? Object.entries(s.attrs).map(([k, v]) => `${k}: ${v}`).join(" · ") : "";
        verdict(true, "VERIFIED", s.name || s.user_id,
                `${s.name ? s.user_id + " · " : ""}score ${d.score}${attrs ? " · " + attrs : ""}`, d.issuer);
    } else if (d.code === "capture_quality") {
        $("live-capture").textContent = "Try again - " + (d.message || "capture unusable");
    } else {
        const [big, sub] = FAIL_COPY[d.code] || ["Verification failed", d.message || ""];
        verdict(false, big, (d.subject || {}).name || "", sub, d.issuer);
    }
};

$("v-again").onclick = () => location.reload();
</script>
</body>
</html>
