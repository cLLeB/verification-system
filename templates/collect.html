<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f16">
    <title>Collect - liveness test set</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #0d0f16; color: #eef1f9; min-height: 100vh;
               display: flex; flex-direction: column; align-items: center; padding: 16px 14px; gap: 12px; }
        h1 { font-size: 1.05rem; } .sub { font-size: .8rem; color: #9aa3b8; text-align: center; max-width: 460px; }
        .stage { position: relative; width: 100%; max-width: 460px; aspect-ratio: 3/4; max-height: 60vh;
                 border-radius: 16px; overflow: hidden; background: #000; border: 1px solid #232b3d; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
        .flash.go { animation: f .3s ease; } @keyframes f { from { opacity: .8; } to { opacity: 0; } }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 460px; }
        .btn { border: 0; border-radius: 12px; padding: 16px; font-size: 1rem; font-weight: 700; cursor: pointer; color: #fff; }
        .live { background: #1f7a4c; } .spoof { background: #a1334c; }
        .btn small { display: block; font-size: .72rem; font-weight: 500; opacity: .85; margin-top: 3px; }
        .row { display: flex; gap: 10px; width: 100%; max-width: 460px; }
        .ghost { flex: 1; background: #1b2030; color: #dfe4f2; border: 0; border-radius: 10px; padding: 11px; font-weight: 600; cursor: pointer; }
        .tally { font-size: .85rem; color: #cfd6e6; } .tally b { color: #fff; }
        .warn { color: #fbbf24; font-size: .82rem; text-align: center; }
        label.chk { font-size: .82rem; color: #9aa3b8; display: flex; gap: 6px; align-items: center; }
    </style>
</head>
<body>
    <h1>Collect liveness samples</h1>
    <p class="sub">Build the anti-spoof (PAD) test set on real captures.
        <b>LIVE</b> = a genuine person in front of you. <b>SPOOF</b> = a printed photo or a
        face shown on another phone's screen, held up to this camera.</p>
    <div id="gate"></div>
    <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <div class="flash" id="flash"></div>
    </div>
    <label class="chk"><input type="checkbox" id="palm"> These are PALM captures (not face)</label>
    <div class="grid">
        <button class="btn live" id="cap-live">LIVE<small>genuine person</small></button>
        <button class="btn spoof" id="cap-spoof">SPOOF<small>photo / screen</small></button>
    </div>
    <div class="row">
        <button class="ghost" id="flip">Flip camera</button>
    </div>
    <p class="tally" id="tally">live 0 · spoof 0</p>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN = "{{ token }}";
const ADMIN = {{ 'true' if admin else 'false' }};
const video = $('video');
const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
let facing = 'user', stream = null, busy = false;
const count = { live: 0, spoof: 0, palm_live: 0, palm_spoof: 0 };

// --- camera-freeze watchdog (same fix as the enrol surfaces) ---
function keepVideoAlive(v){ if(!v||v._w)return; v._w=1; const r=()=>{if(v.srcObject&&v.paused){const p=v.play();if(p&&p.catch)p.catch(()=>{});}};
  v.addEventListener('pause',r); document.addEventListener('visibilitychange',()=>{if(!document.hidden)r();}); window.addEventListener('focus',r); window.addEventListener('pageshow',r); }
function nextFrame(v){ return new Promise(res=>{let d=0;const f=()=>{if(!d){d=1;res();}};
  if(typeof v.requestVideoFrameCallback==='function'){try{v.requestVideoFrameCallback(()=>f());}catch(e){f();}}
  else{const t=v.currentTime,s=performance.now();const k=()=>{(v.currentTime>t||performance.now()-s>250)?f():requestAnimationFrame(k);};requestAnimationFrame(k);}
  setTimeout(f,350);}); }
async function ensureLive(v){ if(!v||!v.srcObject)return; if(v.paused||v.ended){const p=v.play();if(p){try{await p;}catch(e){}}} await nextFrame(v); }

async function startCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
        video.srcObject = stream; try { await video.play(); } catch(e){} keepVideoAlive(video);
    } catch (e) { $('gate').innerHTML = '<p class="warn">Camera unavailable - allow access and reload.</p>'; }
}
function grab() {
    const vw = video.videoWidth, vh = video.videoHeight; if (!vw || !vh) return null;
    const w = Math.min(720, vw), h = Math.round(w * vh / vw);
    canvas.width = w; canvas.height = h; ctx.drawImage(video, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', 0.92);
}
function renderTally(){ $('tally').textContent =
    `face: live ${count.live} · spoof ${count.spoof}   |   palm: live ${count.palm_live} · spoof ${count.palm_spoof}`; }

async function capture(kind) {
    if (busy) return; busy = true;
    try {
        await ensureLive(video);
        const img = grab();
        if (!img) return;
        $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
        let label = kind;
        if ($('palm').checked) label = (kind === 'live' ? 'palm_live' : 'palm_spoof');
        const d = await fetch('/api/collect', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: TOKEN, label, image: img }) }).then(r => r.json()).catch(() => ({}));
        if (d.success) { count[label] = d.count; renderTally(); $('gate').innerHTML = ''; }
        else if (d.code === 'forbidden') $('gate').innerHTML = '<p class="warn">Not saving - sign in at /admin first (or open /collect?token=YOUR_SECRET).</p>';
    } finally { busy = false; }
}
$('cap-live').onclick = () => capture('live');
$('cap-spoof').onclick = () => capture('spoof');
$('flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; await startCamera(); };
if (!TOKEN && !ADMIN) $('gate').innerHTML = '<p class="warn">Sign in at <b>/admin</b> first (or add ?token=YOUR_SECRET) so captures save.</p>';
startCamera();
</script>
</body>
</html>
